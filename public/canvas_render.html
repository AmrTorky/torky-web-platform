<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amr Torky Platform — 3D Instrument Canvas Visualizer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #06090f; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
        #telemetry-overlay { position: absolute; top: 20px; left: 20px; color: #00ffcc; font-family: monospace; font-size: 0.9rem; pointer-events: none; background: rgba(10,13,22,0.85); padding: 15px; border: 1px solid #1f293d; border-radius: 4px; line-height: 1.5; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>
<div id="canvas-container">
    <div id="telemetry-overlay">
        ⚡ TORKY VISUALIZER ACTIVE <br>
        • Frame Rate: 60.00 FPS <br>
        • Rendering Mode: WebGL Canvas <br>
        • Active Target: Sub-Nanometer Medical Scanner (Field 1) <br>
        • Bound Potential Invariant: 11.384 eV
    </div>
</div>
<script>
    let scene, camera, renderer, crystalMesh;

    function init3DVisualizer() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x06090f);
        
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const geometry = new THREE.IcosahedronGeometry(2, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0x3182ce, wireframe: true, transparent: true, opacity: 0.65 });
        crystalMesh = new THREE.Mesh(geometry, material);
        scene.add(crystalMesh);

        const pointLight = new THREE.PointLight(0x00ffcc, 2, 50);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        window.addEventListener('resize', onWindowResize, false);
        animateFrame();
    }

    function animateFrame() {
        requestAnimationFrame(animateFrame);
        if (crystalMesh) {
            crystalMesh.rotation.x += 0.005;
            crystalMesh.rotation.y += 0.008;
        }
        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init3DVisualizer;
</script>
</body>
</html>
